name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1

      - uses: actions/upload-artifact@v4
        with:
          name: Workout-Tracker-APK
          path: ./**/*.apk
